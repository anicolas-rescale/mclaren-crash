# Longer train, production-ish GeoT, same McLaren enabled I/O.
# 11 knobs in, 39 probe globals out, displacement nodal out. No timesteps.

hydra:
  job:
    chdir: True
  run:
    dir: ${model_dir}

defaults:
  - reader: vtp
  - datapipe: point_cloud
  - model: geotransolver_time_conditional
  - training: default
  - inference: default
  - _self_

model_dir: /enc/udeprod_ApZxU/mclaren_npoints20k_prod/models/geo-global-ts/versions/0

paths:
  artifacts: ${model_dir}/artifacts
  evaluation: ${model_dir}/evaluation
  models: ${model_dir}/models
  logs: ${model_dir}/logs
  statistics: ${model_dir}/statistics
ckpt_path: ${paths.models}/checkpoints
logs_path: ${paths.logs}
statistics_path: ${paths.statistics}
training_csv: ${paths.artifacts}/training.csv
validation_csv: ${paths.artifacts}/validation.csv
test_csv: ${paths.artifacts}/test.csv
evaluation_path: ${paths.evaluation}

training:
  raw_data_dir: /enc/udeprod.fNLMWb/work/datasets/mclaren-p35-side-pole-19/preprocessed/v9306c79e
  raw_data_dir_validation: /enc/udeprod.fNLMWb/work/datasets/mclaren-p35-side-pole-19/preprocessed/v9306c79e
  global_features_filepath: null
  optimizer: adam
  epochs: 20
  amp: true
  num_dataloader_workers: 1
  num_time_steps: 41
  num_training_samples: 18
  num_validation_samples: 0
  start_lr: 0.0001
  global_loss_weight: 1.0
  save_checkpoint_freq: 5

inference:
  raw_data_dir_test: /enc/udeprod.fNLMWb/work/datasets/mclaren-p35-side-pole-19/preprocessed/v9306c79e

datapipe:
  static_features: []
  dynamic_features: []
  dynamic_targets: []
  global_features:
    - door_inner_mm
    - door_outer_mm
    - ttf_ms
    - airbag_E22
    - airbag_z_up_mm
    - bracket_cutt
    - trim_woodfibre
    - brace_P16
    - cavity_foam_gl
    - rail_foam
    - seat_inb_foam
  outvar_ts_keys:
    - backplate_force_x
    - backplate_force_y
    - backplate_force_z
    - backplate_moment_x
    - backplate_moment_y
    - backplate_moment_z
    - head_acceleration_x
    - head_acceleration_y
    - head_acceleration_z
    - lower_rib_defl
    - middle_rib_defl
    - neck_upper_force_x
    - neck_upper_force_y
    - neck_upper_force_z
    - neck_upper_moment_x
    - neck_upper_moment_y
    - neck_upper_moment_z
    - pelvis_acceleration_x
    - pelvis_acceleration_y
    - pelvis_acceleration_z
    - pubic_force_x
    - pubic_force_y
    - pubic_force_z
    - shoulder_left_force_x
    - shoulder_left_force_y
    - shoulder_left_force_z
    - t12_acceleration_x
    - t12_acceleration_y
    - t12_acceleration_z
    - t12_loadcell_force_x
    - t12_loadcell_force_y
    - t12_loadcell_force_z
    - t12_loadcell_moment_x
    - t12_loadcell_moment_y
    - t12_loadcell_moment_z
    - t1_acceleration_x
    - t1_acceleration_y
    - t1_acceleration_z
    - upper_rib_defl
  sample_type: one_time_step

model:
  functional_dim: 4
  out_dim: 3
  geometry_dim: 3
  global_dim: 11
  n_layers: 6
  n_hidden: 256
  n_head: 8
  slice_num: 128
  use_te: false
  include_local_features: true
  global_output_dim: 39
  global_decoder_aggregation: mean
